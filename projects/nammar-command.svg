      <path d="M42 182c30-45 22-82 46-119 15-22 25-27 37-39" fill="none" stroke="#7195a0" stroke-opacity=".48" stroke-width="7" stroke-linecap="round"/>
      <text x="18" y="205" fill="#537681" font-family="Arial" font-size="8">WALVIS BAY</text>
      <text x="230" y="205" fill="#537681" font-family="Arial" font-size="8">LÜDERITZ</text>
      <g fill="#38d5c5">
        <circle cx="91" cy="91" r="7"/><circle cx="178" cy="143" r="6"/><circle cx="245" cy="91" r="6"/>
      </g>
      <circle cx="91" cy="91" r="16" fill="none" stroke="#38d5c5" stroke-opacity=".32"/>
      <rect x="108" y="55" width="153" height="58" rx="7" fill="#0d3037" stroke="#3e6e74"/>
      <text x="120" y="74" fill="#64ddd1" font-family="Arial" font-size="7" letter-spacing="1">PRIORITY TRACK</text>
      <text x="120" y="94" fill="#edf9fa" font-family="Arial" font-weight="700" font-size="12">R/V MIRABILIS</text>
      <text x="120" y="106" fill="#749da5" font-family="Arial" font-size="7">MMSI 659620000 · V5NM</text>
    </g>

    <g transform="translate(158 440)">
      <rect width="90" height="52" rx="9" fill="#0e2830"/><rect x="102" width="90" height="52" rx="9" fill="#0e2830"/><rect x="204" width="90" height="52" rx="9" fill="#0e2830"/>
      <g fill="#effafa" font-family="Arial" font-weight="700" font-size="18"><text x="14" y="25">03</text><text x="116" y="25">94%</text><text x="218" y="25">92%</text></g>
      <g fill="#688f98" font-family="Arial" font-size="7" letter-spacing="1"><text x="14" y="41">VESSELS</text><text x="116" y="41">CREW READY</text><text x="218" y="41">ASSURANCE</text></g>
