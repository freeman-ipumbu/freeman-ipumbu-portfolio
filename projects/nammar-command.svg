    <text x="39" y="76" fill="#62949e" font-family="Arial" font-size="8" letter-spacing="1">OPERATIONS</text>
    <g fill="#7499a1" font-family="Arial" font-size="9">
      <text x="39" y="126">OVERVIEW</text><text x="39" y="166">VOYAGES</text><text x="39" y="206">FLEET</text><text x="39" y="246">MARINE CREW</text><text x="39" y="286">PORT CALLS</text>
    </g>
    <rect x="29" y="99" width="94" height="38" rx="7" fill="#123941" stroke="#38d5c5" stroke-opacity=".5"/>
    <circle cx="43" cy="118" r="4" fill="#38d5c5"/>

    <text x="158" y="48" fill="#739aa4" font-family="Arial" font-size="9" letter-spacing="2">LIVE OPERATING PICTURE</text>
    <text x="158" y="77" fill="#edf9fa" font-family="Arial" font-weight="700" font-size="22">Overview</text>

    <rect x="158" y="98" width="296" height="78" rx="12" fill="#0e2b32" stroke="#2f6067"/>
    <circle cx="185" cy="126" r="11" fill="#143f45"/><path d="M178 128c5-8 10-8 15 0" fill="none" stroke="#64e4d5" stroke-width="3" stroke-linecap="round"/>
    <text x="208" y="120" fill="#6f9ba4" font-family="Arial" font-size="8" letter-spacing="1">CREW-CHANGE ASSESSMENT</text>
    <text x="208" y="145" fill="#e9fbfb" font-family="Arial" font-weight="700" font-size="16">Good day for crew change</text>
    <text x="208" y="161" fill="#72aaa9" font-family="Arial" font-size="9">0.9 m sea · 11 kn wind · 9 nm visibility</text>

