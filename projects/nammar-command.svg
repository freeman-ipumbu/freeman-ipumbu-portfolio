<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">NamMar Command</title>
  <desc id="desc">Vessel operations command centre with live marine weather, crew-change guidance and government fleet tracking</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#06131a"/>
      <stop offset=".56" stop-color="#0b2730"/>
      <stop offset="1" stop-color="#071118"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38d5c5"/>
      <stop offset="1" stop-color="#6ad8ff"/>
    </linearGradient>
    <radialGradient id="seaGlow">
      <stop stop-color="#38d5c5" stop-opacity=".22"/>
      <stop offset="1" stop-color="#38d5c5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#8bd5df" stroke-opacity=".07"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="935" cy="304" r="340" fill="url(#seaGlow)"/>

  <g transform="translate(60 72)">
    <rect width="68" height="68" rx="15" fill="#38d5c5"/>
    <path d="M17 37h34l-5 12H23Zm8-12h18l5 9H20Zm7-10h5v10h-5Z" fill="#06151b"/>
    <path d="M15 53c8 5 30 5 38 0" fill="none" stroke="#06151b" stroke-width="3" stroke-linecap="round"/>
  </g>

  <text x="60" y="230" fill="#eefbfc" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="66" letter-spacing="-3">NamMar</text>
  <text x="60" y="292" fill="#38d5c5" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="56" letter-spacing="5">COMMAND</text>
  <text x="63" y="344" fill="#8fb5be" font-family="Arial,Helvetica,sans-serif" font-size="17" letter-spacing="2">VOYAGES · FLEET · WEATHER · ASSURANCE</text>
  <path d="M63 392h510" stroke="#315965"/>
  <text x="63" y="438" fill="#d9e9ec" font-family="Arial,Helvetica,sans-serif" font-size="23">One operating picture for the Namibian coast.</text>
  <text x="63" y="526" fill="#6f949e" font-family="Arial,Helvetica,sans-serif" font-size="15" letter-spacing="2">VESSEL OPERATIONS CASE STUDY · NAMIBIA · 2026</text>

  <g transform="translate(658 52)">
