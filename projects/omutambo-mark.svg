  <defs><pattern id="field" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M8 25l5-10 5 10M27 20l3-6 3 6" fill="none" stroke="#dceb8d" stroke-width="1.3" opacity=".12"/></pattern></defs>
  <rect width="1200" height="630" fill="#193c30"/>
  <rect width="1200" height="630" fill="url(#field)"/>
  <g transform="translate(492 70) scale(3.375)">
