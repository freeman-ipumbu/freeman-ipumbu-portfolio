  <text x="600" y="547" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#b9c9bb">YOUR HERD · YOUR GROUND · YOUR CONTROL</text>
