<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SolarSpin Technologies website case study</title>
  <desc id="desc">A deep navy cover with orbital geometry, the SolarSpin core and the words The Centre of the Universe.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#040b12"/>
      <stop offset="0.56" stop-color="#071522"/>
      <stop offset="1" stop-color="#101f30"/>
    </linearGradient>
    <radialGradient id="core" cx="38%" cy="30%" r="75%">
      <stop stop-color="#ff8aa7"/>
      <stop offset="0.42" stop-color="#ff4f7b"/>
      <stop offset="1" stop-color="#c71e50"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop stop-color="#5655e8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#5655e8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#b7c2cf" stroke-opacity="0.055"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1250" cy="450" r="400" fill="url(#halo)"/>
  <g fill="none" transform="translate(1250 450) rotate(-9)">
    <ellipse rx="300" ry="156" stroke="#8585ff" stroke-opacity="0.58" stroke-width="2"/>
    <ellipse rx="236" ry="236" stroke="#36e1c3" stroke-opacity="0.34" stroke-width="2"/>
    <ellipse rx="362" ry="245" stroke="#b7c2cf" stroke-opacity="0.18" stroke-dasharray="7 12"/>
    <ellipse rx="174" ry="110" stroke="#5655e8" stroke-opacity="0.7" stroke-dasharray="3 7"/>
  </g>
  <circle cx="1250" cy="450" r="96" fill="#ff4f7b" opacity="0.18" filter="url(#glow)"/>
  <circle cx="1250" cy="450" r="64" fill="url(#core)"/>
  <circle cx="1250" cy="450" r="6" fill="#f8fafc"/>
  <circle cx="1015" cy="316" r="12" fill="#36e1c3"/>
  <circle cx="1449" cy="589" r="9" fill="#8585ff"/>
  <circle cx="1295" cy="223" r="5" fill="#ff4f7b"/>
  <path d="M1175 450h22m106 0h22" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <text x="1250" y="460" text-anchor="middle" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="21" font-weight="800" letter-spacing="5">SST</text>
  <g transform="translate(80 74)">
    <circle cx="18" cy="18" r="15" fill="none" stroke="#36e1c3" stroke-width="4"/>
    <path d="M3 18c15-21 35-11 30 3-4 12-23 6-23 21 0 15 24 18 36 1" fill="none" stroke="#8585ff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="31" cy="20" r="5" fill="#ff4f7b"/>
    <text x="65" y="17" fill="#f8fafc" font-family="Arial, sans-serif" font-size="25" font-weight="900">SOLARSPIN</text>
    <text x="66" y="37" fill="#b7c2cf" font-family="ui-monospace, monospace" font-size="9" font-weight="700" letter-spacing="5">TECHNOLOGIES</text>
  </g>
  <g transform="translate(80 255)">
    <text fill="#36e1c3" font-family="ui-monospace, monospace" font-size="15" font-weight="800" letter-spacing="4">WEBSITE CASE STUDY  /  2026</text>
    <text y="95" fill="#f8fafc" font-family="Arial, sans-serif" font-size="88" font-weight="900" letter-spacing="-5">The centre</text>
    <text y="180" fill="#f8fafc" font-family="Arial, sans-serif" font-size="88" font-weight="900" letter-spacing="-5">of the universe.</text>
    <text y="253" fill="#b7c2cf" font-family="Arial, sans-serif" font-size="25">A cinematic digital headquarters for systems that hold.</text>
  </g>
  <g transform="translate(80 730)">
    <rect width="650" height="86" rx="22" fill="#101f30" stroke="#304155"/>
    <text x="28" y="34" fill="#8585ff" font-family="ui-monospace, monospace" font-size="12" font-weight="800" letter-spacing="2">BUILT IN WINDHOEK, NAMIBIA</text>
    <text x="28" y="64" fill="#f8fafc" font-family="Arial, sans-serif" font-size="18" font-weight="700">Strategy  /  Identity  /  UX  /  Frontend  /  Launch</text>
  </g>
  <text x="1520" y="830" text-anchor="end" fill="#b7c2cf" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2">FOUNDED BY FREEMAN IPUMBU  •  NOVEMBER 2025</text>
</svg>
