<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ECC Command for E.M.A. Namibia</title>
  <desc id="desc">Emergency command product artwork with radar rings, priority cases and unit status.</desc>
