    <text x="30" y="86" fill="#090909" font-family="Baskerville,Georgia,serif" font-style="italic" font-size="19" font-weight="800" letter-spacing="3">TITO PASS · GROUP SAVINGS · EWALLET · BANK TRANSFER</text>
  </g>
  <text x="74" y="854" fill="#8e948d" font-family="Baskerville,Georgia,serif" font-style="italic" font-size="18" font-weight="800" letter-spacing="3">PRODUCT STRATEGY · IDENTITY · UX/UI · FULL-STACK ENGINEERING · CLOUDFLARE D1</text>
