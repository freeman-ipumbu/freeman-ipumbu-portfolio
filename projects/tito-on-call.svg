<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Tito On Call product case study</title>
  <desc id="desc">Classic black, white and barber-red editorial cover showing Tito's mobile barber booking flow and private control room.</desc>
  <defs>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#382426" stroke-width="2"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="#090909"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity=".75"/>
  <g transform="translate(70 72) scale(1.333333)">
    <rect width="96" height="96" rx="18" fill="#090909"/>
    <rect x="3" y="3" width="90" height="90" rx="15" fill="none" stroke="#fffdf8" stroke-width="2"/>
    <g transform="translate(8 0) skewX(-10)">
      <path fill="#e32636" d="M18 20h60v16H57v42H39V36H18z"/>
      <path fill="#fffdf8" d="M18 12h8v8h-8zm13 0h8v8h-8zm13 0h8v8h-8zm13 0h8v8h-8zm13 0h8v8h-8z"/>
      <path fill="#fffdf8" d="M57 50l21-10v16L57 66z"/>
    </g>
  </g>
  <text x="230" y="126" fill="#fffdf8" font-family="Baskerville,Georgia,serif" font-style="italic" font-size="58" font-weight="900" letter-spacing="-2">TITO ON CALL</text>
  <text x="233" y="171" fill="#e32636" font-family="Baskerville,Georgia,serif" font-style="italic" font-size="22" font-weight="800" letter-spacing="7">FRESH CUTS. YOUR PLACE.</text>
  <text x="72" y="335" fill="#fffdf8" font-family="Baskerville,Georgia,serif" font-style="italic" font-size="102" font-weight="900" letter-spacing="-7">A SHARP CUT</text>
  <text x="72" y="432" fill="#fffdf8" font-family="Baskerville,Georgia,serif" font-style="italic" font-size="102" font-weight="900" letter-spacing="-7">SHOULDN’T COST</text>
  <text x="72" y="529" fill="#e32636" font-family="Baskerville,Georgia,serif" font-style="italic" font-size="102" font-weight="900" letter-spacing="-7">A CRAZY AMOUNT.</text>
  <g transform="translate(965 92) rotate(2)">
    <rect width="555" height="685" fill="#fffdf8" stroke="#e32636" stroke-width="8"/>
    <rect x="26" y="28" width="503" height="128" fill="#e32636" stroke="#090909" stroke-width="5"/>
    <text x="52" y="73" fill="#090909" font-family="Baskerville,Georgia,serif" font-style="italic" font-size="18" font-weight="900" letter-spacing="4">TITO’S CONTROL ROOM</text>
    <text x="52" y="118" fill="#090909" font-family="Baskerville,Georgia,serif" font-style="italic" font-size="35" font-weight="900">TALENT IN THE CHAIR.</text>
    <text x="52" y="151" fill="#090909" font-family="Baskerville,Georgia,serif" font-style="italic" font-size="35" font-weight="900">CLARITY BEHIND IT.</text>
    <g fill="#090909"><rect x="26" y="182" width="503" height="52"/><rect x="26" y="260" width="239" height="142"/><rect x="290" y="260" width="239" height="142"/><rect x="26" y="428" width="503" height="64"/><rect x="26" y="518" width="320" height="136"/><rect x="370" y="518" width="159" height="136" fill="#e32636"/></g>
    <g fill="#e32636" font-family="Baskerville,Georgia,serif" font-style="italic" font-size="16" font-weight="900"><text x="52" y="215">OVERVIEW · BOOKINGS · SCHEDULE · MONEY · SETUP</text><text x="50" y="300">TODAY</text><text x="314" y="300">PAYMENTS</text><text x="50" y="468">LIVE BOOK · ROUTES · REQUESTS</text></g>
    <g fill="#fffdf8" font-family="Baskerville,Georgia,serif" font-style="italic" font-weight="900"><text x="50" y="362" font-size="58">03</text><text x="314" y="362" font-size="42">N$320</text><text x="50" y="565" font-size="21">PRIVATE OWNER DESK</text><text x="50" y="603" font-size="21">D1 BOOKING TRUTH</text><text x="50" y="641" font-size="21">FAIR LIVE PRICING</text><text x="408" y="584" font-size="62">5</text><text x="397" y="619" font-size="15" letter-spacing="2">CUTS = PERK</text></g>
  </g>
  <g transform="translate(72 674)">
    <rect width="765" height="118" fill="#e32636" stroke="#fffdf8" stroke-width="4"/>
